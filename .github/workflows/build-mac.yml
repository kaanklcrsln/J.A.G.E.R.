# Builds the macOS dmgs on a GitHub runner. Manual trigger only; the dmgs land
# as run artifacts and are attached to a release by hand.
name: build-mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never

      - name: Smoke the arm64 app
        env:
          JAGER_SMOKE_DATA_DIR: ${{ runner.temp }}/jager-smoke
        run: |
          out=$(dist/mac-arm64/Jager.app/Contents/MacOS/Jager --smoke 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'smoke ok' || { echo 'smoke did not report ok' >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: jager-mac-dmgs
          path: dist/Jager-*.dmg
          if-no-files-found: error
          retention-days: 14
